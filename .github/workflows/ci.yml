name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI never talks to a chain or a real project: mock mode, phase-0 limits.
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_APP_ENV: local
  NEXT_PUBLIC_CHAIN_MODE: mock
  NEXT_PUBLIC_SOLANA_CLUSTER: devnet
  NEXT_PUBLIC_FEE_BPS: '300'
  NEXT_PUBLIC_MAX_STAKE_USDC: '100'

jobs:
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests with coverage
        run: pnpm -r test

      - name: Build
        run: pnpm build

  # The escrow program had no CI at all until now: it was built and checked by hand, in WSL,
  # on one machine. This runs the part that needs no Solana toolchain — the money. The vectors
  # it reads are generated from `calculateSettlement`, so a change to the fee, the rounding or
  # the split fails here until the program agrees with the domain again.
  #
  # Instruction-level tests (LiteSVM) need a built program and come with the next slice.
  program:
    name: rust · parity with the domain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/program

      # Money, constants and transitions — each read from a file the domain generates.
      - name: Parity with the domain
        run: cargo test --package sporim --test parity --test constants_parity --test transitions_parity
        working-directory: packages/program

  # Every contributor here is on Windows; a green Linux run that breaks `pnpm dev`
  # locally is worthless, so install and typecheck also run on windows-latest.
  windows:
    name: windows install · typecheck
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm -r test

  e2e:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm --filter @sporim/web exec playwright install --with-deps chromium

      - name: Run end-to-end specs
        run: pnpm --filter @sporim/web test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
